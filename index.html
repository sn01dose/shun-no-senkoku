<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050507">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="しゅんの宣告">
<meta property="og:title" content="しゅんの宣告">
<meta property="og:description" content="悩める君に、しゅんが今日のひと言を宣告する。毎日0時更新。">
<meta property="og:url" content="https://sn01dose.github.io/shun-no-senkoku/">
<meta property="og:image" content="https://sn01dose.github.io/shun-no-senkoku/og.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<title>しゅんの宣告</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;300;400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body {
  background: #000;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 16px 32px;
  font-family: 'Noto Serif JP', serif;
  -webkit-font-smoothing: antialiased;
}

/* ================================================
   THE CARD — this is what gets screenshotted
   ================================================ */
#capture-card {
  position: relative;
  width: 100%;
  max-width: 390px;
  /* Vertical: golden-ish proportion for mobile screenshot */
  padding: 52px 36px 44px;
  background: #09090d;
  overflow: hidden;
  isolation: isolate;
  /* Subtle border for definition on dark bg */
  box-shadow: inset 0 0 0 0.5px rgba(192,192,192,0.12);
}

/* Marble base */
#capture-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 500px 250px at 10% 5%, rgba(255,255,255,0.045), transparent 60%),
    radial-gradient(ellipse 400px 350px at 92% 98%, rgba(180,190,220,0.035), transparent 65%),
    linear-gradient(135deg, #080810 0%, #14141e 28%, #09090f 55%, #181820 82%, #0b0b13 100%);
  z-index: 0;
}
/* Marble vein */
#capture-card::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(108deg, transparent 44%, rgba(255,255,255,0.018) 46%, rgba(255,255,255,0.028) 47%, rgba(255,255,255,0.018) 48%, transparent 50%),
    linear-gradient(72deg, transparent 30%, rgba(255,255,255,0.01) 33%, rgba(255,255,255,0.016) 34%, transparent 36%);
  background-size: 380px 580px, 560px 380px;
  z-index: 0;
}

/* Smoke / atmosphere */
.card-smoke {
  position: absolute;
  inset: 0;
  z-index: 1;
  opacity: 0.55;
  mix-blend-mode: screen;
  background:
    radial-gradient(ellipse 320px 200px at 22% 20%, rgba(210,215,240,0.065), transparent 70%),
    radial-gradient(ellipse 260px 190px at 78% 70%, rgba(190,200,225,0.05), transparent 70%),
    radial-gradient(ellipse 400px 280px at 50% 105%, rgba(150,160,195,0.07), transparent 70%);
  animation: smoke 28s ease-in-out infinite;
}
@keyframes smoke {
  0%,100% { transform: translate(0,0) scale(1); }
  50%      { transform: translate(-6px,8px) scale(1.06); }
}

/* Vignette */
.card-veil {
  position: absolute;
  inset: 0;
  z-index: 2;
  background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.52) 90%);
}

/* All card content sits on z-index 5+ */
.card-inner {
  position: relative;
  z-index: 5;
  text-align: center;
  color: #e8e8ea;
}

/* ---- Brand ---- */
.c-brand {
  font-family: 'Cormorant Garamond', serif;
  font-size: 10px;
  letter-spacing: 0.6em;
  color: #9a9aa4;
  text-transform: uppercase;
  margin-bottom: 20px;
  opacity: 0;
  animation: fadein 1.4s ease 0.2s forwards;
}

/* ---- Main title ---- */
.c-title {
  font-family: 'Noto Serif JP', serif;
  font-weight: 300;
  font-size: 30px;
  letter-spacing: 0.55em;
  color: #f2f2f4;
  text-indent: 0.55em;
  margin-bottom: 8px;
  opacity: 0;
  animation: fadein 1.4s ease 0.5s forwards;
}
.c-title-en {
  font-family: 'Cormorant Garamond', serif;
  font-size: 10px;
  letter-spacing: 0.7em;
  color: #7a7a88;
  text-transform: uppercase;
  font-weight: 300;
  margin-bottom: 24px;
  opacity: 0;
  animation: fadein 1.4s ease 0.8s forwards;
}

/* ---- Silver vertical line ---- */
.c-vline {
  width: 1px;
  height: 30px;
  margin: 6px auto 24px;
  background: linear-gradient(to bottom,
    transparent,
    rgba(192,192,192,0.35) 20%,
    #C0C0C0 50%,
    rgba(192,192,192,0.35) 80%,
    transparent);
  position: relative;
  opacity: 0;
  animation: linedown 1.6s cubic-bezier(0.22,1,0.36,1) 1.0s forwards;
}
.c-vline::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  width: 3px; height: 3px;
  background: #C0C0C0;
  border-radius: 50%;
  transform: translate(-50%,-50%);
  box-shadow: 0 0 8px rgba(192,192,192,0.8), 0 0 18px rgba(192,192,192,0.3);
}
@keyframes linedown {
  from { opacity:0; height:0; }
  to   { opacity:1; height:30px; }
}

/* ---- Date ---- */
.c-date {
  font-family: 'Inter', sans-serif;
  font-size: 10px;
  letter-spacing: 0.4em;
  color: #ababb4;
  margin-bottom: 36px;
  opacity: 0;
  animation: fadein 1.2s ease 1.8s forwards;
}

/* ---- Oracle message ---- */
.c-oracle {
  font-family: 'Noto Serif JP', serif;
  font-weight: 300;
  font-size: 16px;
  line-height: 2.5;
  letter-spacing: 0.2em;
  color: #f4f4f6;
  margin: 0 4px 38px;
  min-height: 120px;
}
.c-oracle .ch {
  display: inline-block;
  opacity: 0;
  transform: translateY(12px);
  transition: opacity 0.75s cubic-bezier(0.22,1,0.36,1),
              transform 0.75s cubic-bezier(0.22,1,0.36,1);
}
.c-oracle .ch.on { opacity:1; transform:translateY(0); }

/* ---- Lucky divider ---- */
.c-divider {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin: 24px 0 16px;
  opacity: 0;
  transition: opacity 0.9s ease;
}
.c-divider.on { opacity: 1; }
.c-divider span {
  height: 1px;
  width: 32px;
  background: linear-gradient(to right, transparent, rgba(192,192,192,0.4), transparent);
}
.c-divider em {
  font-family: 'Cormorant Garamond', serif;
  font-style: normal;
  font-size: 9px;
  letter-spacing: 0.55em;
  color: #a0a0a8;
  text-transform: uppercase;
}

/* ---- Lucky badge ---- */
.c-lucky-wrap {
  margin-bottom: 40px;
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 0.9s ease, transform 0.9s ease;
}
.c-lucky-wrap.on { opacity:1; transform:translateY(0); }

.c-lucky-badge {
  position: relative;
  display: inline-block;
  padding: 11px 26px;
  border: 0.5px solid rgba(212,212,218,0.8);
  color: #ededef;
  font-family: 'Noto Serif JP', serif;
  font-size: 13px;
  font-weight: 300;
  letter-spacing: 0.28em;
  background: rgba(10,10,18,0.35);
}
.c-lucky-badge::before,
.c-lucky-badge::after {
  content: '';
  position: absolute;
  width: 6px; height: 6px;
}
.c-lucky-badge::before {
  top: -3px; left: -3px;
  border-top: 0.5px solid #C0C0C0;
  border-left: 0.5px solid #C0C0C0;
}
.c-lucky-badge::after {
  bottom: -3px; right: -3px;
  border-bottom: 0.5px solid #C0C0C0;
  border-right: 0.5px solid #C0C0C0;
}

/* ---- Signature ---- */
.c-sig {
  font-family: 'Cormorant Garamond', serif;
  font-size: 10px;
  letter-spacing: 0.45em;
  color: #888898;
  text-transform: uppercase;
  margin-top: 32px;
  opacity: 0;
  transition: opacity 0.9s ease;
}
.c-sig.on { opacity: 1; }
.c-sig .name {
  display: block;
  margin-top: 7px;
  font-family: 'Noto Serif JP', serif;
  font-size: 14px;
  letter-spacing: 0.35em;
  color: #c0c0ca;
  text-transform: none;
}

/* ---- Streak badge ---- */
.c-streak {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 18px;
  opacity: 0;
  animation: fadein 1.2s ease 0.35s forwards;
}
.c-streak-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 14px;
  border: 0.5px solid rgba(192,192,192,0.25);
  background: rgba(255,255,255,0.03);
  font-family: 'Inter', sans-serif;
  font-size: 10px;
  letter-spacing: 0.35em;
  color: #b0b0bc;
}
.c-streak-num {
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  font-weight: 400;
  letter-spacing: 0.05em;
  color: #d8d8e0;
  line-height: 1;
}
/* milestone glow */
.c-streak-badge.milestone {
  border-color: rgba(192,192,192,0.55);
  background: rgba(192,192,192,0.06);
  box-shadow: 0 0 18px rgba(192,192,192,0.08);
}
.c-streak-badge.milestone .c-streak-num { color: #f0f0f4; }

/* ---- Hashtag — part of the card design ---- */
.c-hashtag {
  margin-top: 28px;
  font-family: 'Inter', sans-serif;
  font-size: 9px;
  letter-spacing: 0.4em;
  color: #787888;
  opacity: 0;
  transition: opacity 0.9s ease;
}
.c-hashtag.on { opacity: 1; }

/* ---- Revisit message (shown below oracle on 2nd+ view) ---- */
.c-revisit {
  margin-top: 32px;
  padding-top: 28px;
  border-top: 0.5px solid rgba(192,192,192,0.12);
  opacity: 0;
  transition: opacity 1s ease;
}
.c-revisit.on { opacity: 1; }
.c-revisit-msg {
  font-family: 'Noto Serif JP', serif;
  font-weight: 300;
  font-size: 13px;
  line-height: 2.4;
  letter-spacing: 0.2em;
  color: #888898;
}
.c-revisit-msg .ch {
  display: inline-block;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.6s cubic-bezier(0.22,1,0.36,1), transform 0.6s cubic-bezier(0.22,1,0.36,1);
}
.c-revisit-msg .ch.on { opacity:1; transform:translateY(0); }

@keyframes fadein {
  from { opacity:0; transform:translateY(5px); }
  to   { opacity:1; transform:translateY(0); }
}
.hidden { display:none !important; }

/* ================================================
   OUTSIDE THE CARD — Action area
   ================================================ */
.action-area {
  width: 100%;
  max-width: 390px;
  padding: 24px 0 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

/* Ghost button — royal blue fill-on-hover */
.ghost-btn {
  position: relative;
  width: 100%;
  background: transparent;
  border: 1px solid #4169E1;
  color: #6B8DEE;
  padding: 15px 0;
  font-family: 'Inter', sans-serif;
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 0.45em;
  text-transform: uppercase;
  cursor: pointer;
  overflow: hidden;
  z-index: 1;
  transition: color 0.4s ease;
}
.ghost-btn::before {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  width: 0; height: 0;
  background: radial-gradient(circle, #4169E1 0%, #2746c0 100%);
  border-radius: 50%;
  transform: translate(-50%,-50%);
  transition: width 0.75s cubic-bezier(0.22,1,0.36,1), height 0.75s cubic-bezier(0.22,1,0.36,1);
  z-index: -1;
}
.ghost-btn:hover, .ghost-btn:active { color: #fff; }
.ghost-btn:hover::before, .ghost-btn:active::before { width: 600px; height: 600px; }

.action-hint {
  font-family: 'Inter', sans-serif;
  font-size: 10px;
  letter-spacing: 0.35em;
  color: #787888;
  text-transform: uppercase;
  text-align: center;
}

/* Download-in-progress overlay */
.dl-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
.dl-overlay.show { opacity:1; pointer-events:all; }
.dl-msg {
  font-family: 'Noto Serif JP', serif;
  font-size: 14px;
  letter-spacing: 0.3em;
  color: #e8e8ea;
  text-align: center;
  line-height: 2.4;
}
.dl-msg em {
  display: block;
  font-style: normal;
  font-family: 'Inter', sans-serif;
  font-size: 10px;
  letter-spacing: 0.4em;
  color: #6B8DEE;
  margin-top: 8px;
  text-transform: uppercase;
}
/* ---- Anniversary (出会って◯日目) ---- */
.c-anniv {
  font-family: 'Noto Serif JP', serif;
  font-weight: 300;
  font-size: 9px;
  letter-spacing: 0.3em;
  color: #8a8a96;
  margin: -8px 0 16px;
  opacity: 0;
  animation: fadein 1.2s ease 0.5s forwards;
}

/* ---- Gold decree (金の宣告) ---- */
.c-gold-label {
  display: none;
  font-family: 'Noto Serif JP', serif;
  font-weight: 300;
  font-size: 11px;
  letter-spacing: 0.5em;
  color: #e6c87a;
  margin-bottom: 14px;
  opacity: 0;
  animation: fadein 1.4s ease 0.4s forwards;
}
.gold .c-gold-label { display: block; }
#capture-card.gold { box-shadow: inset 0 0 0 0.5px rgba(230,200,122,0.4); }
.gold .c-title { color: #f6ead0; }
.gold .c-vline {
  background: linear-gradient(to bottom, transparent,
    rgba(230,200,122,0.4) 20%, #E6C87A 50%, rgba(230,200,122,0.4) 80%, transparent);
}
.gold .c-vline::after {
  background: #E6C87A;
  box-shadow: 0 0 8px rgba(230,200,122,0.85), 0 0 18px rgba(230,200,122,0.35);
}
.gold .c-lucky-badge { border-color: rgba(230,200,122,0.85); color: #f3e9cf; }
.gold .c-lucky-badge::before { border-color: #E6C87A; }
.gold .c-lucky-badge::after  { border-color: #E6C87A; }
.gold .c-streak-badge { border-color: rgba(230,200,122,0.5); }
.gold .c-streak-num { color: #f0e2b8; }
.gold .card-smoke {
  background:
    radial-gradient(ellipse 320px 200px at 22% 20%, rgba(240,220,160,0.06), transparent 70%),
    radial-gradient(ellipse 260px 190px at 78% 70%, rgba(230,200,122,0.05), transparent 70%),
    radial-gradient(ellipse 400px 280px at 50% 105%, rgba(200,170,110,0.07), transparent 70%);
}

/* ---- Moon note (満月・新月) ---- */
.c-moon {
  display: none;
  font-family: 'Noto Serif JP', serif;
  font-weight: 300;
  font-size: 10px;
  letter-spacing: 0.35em;
  color: #b9c2d8;
  margin: -24px 0 30px;
  opacity: 0;
  animation: fadein 1.4s ease 2.0s forwards;
}
.c-moon.on { display: block; }

/* ---- Letter heading (〇〇へ) ---- */
.c-toname {
  font-family: 'Noto Serif JP', serif;
  font-weight: 300;
  font-size: 12px;
  letter-spacing: 0.3em;
  color: #b4b4be;
  margin-bottom: 14px;
  opacity: 0;
  transition: opacity 0.9s ease;
}
.c-toname.on { opacity: 1; }

/* ---- Name prompt ---- */
.c-namebox { display: none; margin: 4px 0 30px; }
.c-namebox.on { display: block; animation: fadein 1s ease 0.4s both; }
.c-name-q {
  font-family: 'Noto Serif JP', serif;
  font-weight: 300;
  font-size: 15px;
  line-height: 2.3;
  letter-spacing: 0.2em;
  color: #ececee;
  margin-bottom: 20px;
}
.c-name-input {
  background: transparent;
  border: none;
  border-bottom: 1px solid rgba(192,192,192,0.4);
  border-radius: 0;
  color: #f2f2f4;
  font-family: 'Noto Serif JP', serif;
  font-size: 16px;
  letter-spacing: 0.15em;
  text-align: center;
  padding: 8px 4px;
  width: 190px;
  outline: none;
}
.c-name-input:focus { border-bottom-color: #C0C0C0; }
.c-name-actions { margin-top: 22px; display: flex; gap: 10px; justify-content: center; align-items: center; }
.c-name-btn {
  border: 0.5px solid rgba(212,212,218,0.8);
  background: rgba(10,10,18,0.35);
  color: #ededef;
  font-family: 'Noto Serif JP', serif;
  font-weight: 300;
  font-size: 12px;
  letter-spacing: 0.25em;
  padding: 10px 24px;
  cursor: pointer;
}
.c-name-skip {
  border: none;
  background: none;
  color: #787888;
  font-family: 'Noto Serif JP', serif;
  font-size: 11px;
  letter-spacing: 0.2em;
  cursor: pointer;
  padding: 10px 8px;
}

/* ---- Night note (おやすみ宣告) ---- */
.c-night {
  display: none;
  margin-top: 30px;
  padding-top: 26px;
  border-top: 0.5px solid rgba(185,194,216,0.14);
  opacity: 0;
  transition: opacity 1s ease;
}
.c-night.show { display: block; }
.c-night.on { opacity: 1; }
.c-night-msg {
  font-family: 'Noto Serif JP', serif;
  font-weight: 300;
  font-size: 13px;
  line-height: 2.4;
  letter-spacing: 0.2em;
  color: #9aa2b8;
}
.c-night-msg .ch {
  display: inline-block;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.6s cubic-bezier(0.22,1,0.36,1), transform 0.6s cubic-bezier(0.22,1,0.36,1);
}
.c-night-msg .ch.on { opacity: 1; transform: translateY(0); }

/* ---- Album button ---- */
.ghost-sub {
  border-color: rgba(192,192,192,0.35);
  color: #a8a8b4;
}
.ghost-sub::before {
  background: radial-gradient(circle, #55555f 0%, #2c2c34 100%);
}

/* ---- Album overlay ---- */
.album {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(5,5,9,0.97);
  display: none;
  flex-direction: column;
  padding: 28px 22px 20px;
}
.album.show { display: flex; }
.album-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  max-width: 390px;
  width: 100%;
  margin: 0 auto 6px;
}
.album-title {
  font-family: 'Noto Serif JP', serif;
  font-weight: 300;
  font-size: 15px;
  letter-spacing: 0.35em;
  color: #e8e8ea;
}
.album-close {
  border: none;
  background: none;
  color: #787888;
  font-family: 'Noto Serif JP', serif;
  font-size: 11px;
  letter-spacing: 0.25em;
  cursor: pointer;
  padding: 6px;
}
.album-list {
  max-width: 390px;
  width: 100%;
  margin: 0 auto;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.album-entry {
  padding: 22px 4px;
  border-bottom: 0.5px solid rgba(192,192,192,0.1);
}
.album-date {
  font-family: 'Inter', sans-serif;
  font-size: 9px;
  letter-spacing: 0.35em;
  color: #8a8a96;
  margin-bottom: 10px;
}
.album-entry.gold .album-date { color: #e6c87a; }
.album-text {
  font-family: 'Noto Serif JP', serif;
  font-weight: 300;
  font-size: 13px;
  line-height: 2.2;
  letter-spacing: 0.15em;
  color: #dcdce2;
  white-space: pre-line;
}
.album-item {
  margin-top: 10px;
  font-family: 'Cormorant Garamond', serif;
  font-size: 9px;
  letter-spacing: 0.4em;
  color: #8a8a96;
  text-transform: uppercase;
}
.album-empty {
  font-family: 'Noto Serif JP', serif;
  font-weight: 300;
  font-size: 13px;
  line-height: 2.4;
  letter-spacing: 0.18em;
  color: #9a9aa4;
  text-align: center;
  padding: 60px 10px;
  white-space: pre-line;
}

/* ---- Tomorrow teaser (outside the card) ---- */
.tomorrow {
  margin-top: 2px;
  text-align: center;
  opacity: 0;
  animation: fadein 1.2s ease 2.8s forwards;
}
.tomorrow-label {
  font-family: 'Cormorant Garamond', serif;
  font-size: 9px;
  letter-spacing: 0.5em;
  color: #63636f;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.tomorrow-text {
  font-family: 'Noto Serif JP', serif;
  font-weight: 300;
  font-size: 12px;
  letter-spacing: 0.22em;
  color: #9a9aa6;

        el.appendChild(s);
      });
      if (li < arr.length - 1) el.appendChild(document.createElement('br'));
    });
    const spans = el.querySelectorAll('.ch');
    spans.forEach((s, i) => setTimeout(() => s.classList.add('on'), startDelay + i * perChar));
    return startDelay + spans.length * perChar;
  }

  /* ==== Render streak badge ==== */
  function renderStreak(streak){
    const isMilestone = streak > 0 && streak % 7 === 0;
    const numEl   = document.getElementById('streak-num');
    const labelEl = document.getElementById('streak-label');
    const badge   = document.getElementById('streak-badge');
    numEl.textContent = streak;
    labelEl.textContent = streak === 1 ? 'DAY' : 'DAYS';
    if (isMilestone) badge.classList.add('milestone');
  }

  /* ==== Main reveal ==== */
  function reveal(streakInfo, fast){
    const { streak, kind, prevStreak } = streakInfo;

    renderStreak(streak);

    // ==== カードの装飾（金・月・記念日・宛名）は毎回反映する ====
    const goldDay  = isGoldDay(today);
    const moonKind = moonKindOf(today);
    const days     = totalDays();

    if (goldDay) document.getElementById('capture-card').classList.add('gold');
    if (moonKind) {
      const moonEl = document.getElementById('moon-note');
      moonEl.textContent = moonKind === 'full' ? '○ 今夜は満月' : '● 今夜は新月';
      moonEl.classList.add('on');
    }
    document.getElementById('anniv').textContent = '出会って ' + days + '日目';
    if (state.n) {
      const toEl = document.getElementById('to-name');
      toEl.textContent = state.n + ' へ';
      setTimeout(() => toEl.classList.add('on'), kind === 'viewed' ? 0 : 1600);
    }

    // ==== 今日の言葉を決める（優先順位つき） ====
    const isMilestone = streak % 7 === 0 && streak > 0;
    let content;
    if (kind === 'viewed' && typeof state.t === 'string') {
      // 同じ日の再訪問 — 今日見せたカードをそのまま復元
      content = { text: state.t, item: state.i };
    } else if (kind === 'broken') {
      // 久しぶりの再訪 — あたたかく迎えて、記録だけ新しく始める
      content = { text: pickComebackMsg(prevStreak), item: pickOracle().item };
    } else if (kind === 'grace') {
      // 数日空けたが継続 — 専用のひと言、ラッキーアイテムは通常どおり
      content = { text: graceMessages[hashStr(today) % graceMessages.length], item: pickOracle().item };
    } else if (annivOracles[days]) {
      // 出会って50日・100日・半年・1年…の記念日
      content = annivOracles[days];
    } else if (isMilestone && kind === 'normal') {
      content = milestones[streak] || milestones[Math.max(...Object.keys(milestones).filter(k => k <= streak).map(Number))] || pickOracle();
    } else if (goldDay) {
      content = goldenOracles[hashStr(today + '|g|' + state.u) % goldenOracles.length];
    } else if (moonKind === 'full') {
      content = fullMoonOracles[hashStr(today) % fullMoonOracles.length];
    } else if (moonKind === 'new') {
      content = newMoonOracles[hashStr(today) % newMoonOracles.length];
    } else {
      content = pickOracle();
    }

    const oracleEl    = document.getElementById('oracle-text');
    const divider     = document.getElementById('divider');
    const luckyWrap   = document.getElementById('lucky-wrap');
    const luckyItem   = document.getElementById('lucky-item');
    const signature   = document.getElementById('signature');
    const hashtag     = document.getElementById('hashtag');
    const revisitEl   = document.getElementById('revisit');
    const revisitText = document.getElementById('revisit-text');

    if (kind === 'viewed') {
      // 2nd+ open same day: show instantly + revisit message
      luckyItem.textContent = content.item || '—';
      animateChars(oracleEl, content.text, 0, 0);
      divider.classList.add('on');
      luckyWrap.classList.add('on');
      signature.classList.add('on');
      hashtag.classList.add('on');
      if (!content.item) {
        divider.style.display = 'none';
        luckyWrap.style.display = 'none';
      }
      setTimeout(() => {
        revisitEl.classList.add('on');
        animateChars(revisitText, revisitMsg(), 200, 55);
      }, 400);
      return;
    }

    // First open today — cinematic reveal
    const startDelay = fast ? 500 : 2200;
    const perChar    = 85;
    const textEnd    = animateChars(oracleEl, content.text, startDelay, perChar);

    if (content.item) {
      luckyItem.textContent = content.item;
      setTimeout(() => divider.classList.add('on'),    textEnd + 200);
      setTimeout(() => luckyWrap.classList.add('on'),  textEnd + 500);
    } else {
      divider.style.display = 'none';
      luckyWrap.style.display = 'none';
    }
    setTimeout(() => signature.classList.add('on'),  textEnd + 850);
    setTimeout(() => hashtag.classList.add('on'),    textEnd + 1150);

    // Save after everything kicks off
    saveStreak(streak, content);
  }

  /* ==== Boot ==== */
  const streakInfo = loadStreak();

  if (!state.n && !state.nA && streakInfo.kind !== 'viewed') {
    // 初対面（または未回答）— 名前を聞いてから今日の言葉へ
    renderStreak(streakInfo.streak);
    document.getElementById('anniv').textContent = '出会って ' + totalDays() + '日目';

    const box     = document.getElementById('name-view');
    const q       = document.getElementById('name-q');
    const input   = document.getElementById('name-input');
    const actions = document.getElementById('name-actions');
    box.classList.add('on');

    let done = false;
    function finish(name){
      if (done) return;
      done = true;
      state.nA = 1;
      if (name) state.n = name;
      saveState();
      if (name) {
        q.textContent = name + '、ね。覚えた。';
        input.style.display = 'none';
        actions.style.display = 'none';
        setTimeout(() => { box.style.display = 'none'; reveal(streakInfo, true); }, 1500);
      } else {
        box.style.display = 'none';
        reveal(streakInfo, true);
      }
    }
    document.getElementById('name-ok').addEventListener('click', () => finish(input.value.trim().slice(0, 12)));
    document.getElementById('name-skip').addEventListener('click', () => finish(''));
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') finish(input.value.trim().slice(0, 12)); });
  } else {
    reveal(streakInfo);
  }

  /* ==== おやすみ宣告（22時〜4時に開いた時のひと言） ==== */
  (function(){
    const hr = new Date().getHours();
    if (hr < 22 && hr >= 4) return;
    const wrap   = document.getElementById('night-note');
    const textEl = document.getElementById('night-text');
    let line = nightLines[hashStr(today) % nightLines.length];
    if (state.n) line = state.n + '、' + line;
    setTimeout(() => {
      wrap.classList.add('show');
      setTimeout(() => wrap.classList.add('on'), 30);
      animateChars(textEl, line, 250, 50);
    }, streakInfo.kind === 'viewed' ? 1400 : 4200);
  })();

  /* ==== 言葉のアルバム ==== */
  (function(){
    const album    = document.getElementById('album');
    const list     = document.getElementById('album-list');
    const openBtn  = document.getElementById('album-btn');
    const closeBtn = document.getElementById('album-close');

    function render(){
      list.innerHTML = '';
      const items = (state.h || []).slice().reverse();
      if (!items.length) {
        const empty = document.createElement('div');
        empty.className = 'album-empty';
        empty.textContent = 'まだここには何もない。\n明日からの言葉を、集めていこう。';
        list.appendChild(empty);
        return;
      }
      items.forEach((e) => {
        const div = document.createElement('div');
        div.className = 'album-entry' + (e.g ? ' gold' : '');
        const d = document.createElement('div');
        d.className = 'album-date';
        d.textContent = e.k.replace(/-/g, ' . ') + (e.g ? '　― 金の宣告 ―' : '');
        const t = document.createElement('div');
        t.className = 'album-text';
        t.textContent = e.t;
        div.appendChild(d);
        div.appendChild(t);
        if (e.i) {
          const it = document.createElement('div');
          it.className = 'album-item';
          it.textContent = e.i;
          div.appendChild(it);
        }
        list.appendChild(div);
      });
    }

    openBtn.addEventListener('click', () => {
      render();
      album.classList.add('show');
      document.body.style.overflow = 'hidden';
    });
    closeBtn.addEventListener('click', () => {
      album.classList.remove('show');
      document.body.style.overflow = '';
    });
  })();

  /* ==== 明日の予告（ぼかしチラ見せ） ==== */
  (function(){
    const el = document.getElementById('tomorrow-snippet');
    if (!el) return;
    const tomorrowKey = shiftDay(today, 1);
    if (isGoldDay(tomorrowKey)) {
      el.textContent = '明日は、少し特別な予感。';
    } else {
      const next = pickOracleFor(tomorrowKey);
      el.textContent = next.text.split('\n')[0].slice(0, 9) + '…';
    }
  })();

  /* ==== ホーム画面追加のヒント（アプリ表示中は隠す） ==== */
  (function(){
    const el = document.getElementById('a2hs');
    if (!el) return;
    const standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
                       || window.navigator.standalone === true;
    if (standalone) el.style.display = 'none';
  })();

  /* ==== Service worker（ホーム画面追加・オフライン用） ==== */
  if ('serviceWorker' in navigator) {
    try { navigator.serviceWorker.register('./sw.js').catch(function(){}); } catch(e){}
  }

  /* ==== html2canvas: save card as PNG ==== */
  document.getElementById('save-btn').addEventListener('click', async () => {
    const btn = document.getElementById('save-btn');
    const overlay = document.getElementById('dl-overlay');
    btn.textContent = '生成中...';
    btn.style.pointerEvents = 'none';

    try {
      // Temporarily hide the action area from view while capturing only the card
      const card = document.getElementById('capture-card');

      const canvas = await html2canvas(card, {
        backgroundColor: '#09090d',
        scale: 3,           // Retina-quality output
        useCORS: true,
        allowTaint: false,
        logging: false,
        // Capture only the card element precisely
        width: card.offsetWidth,
        height: card.offsetHeight,
        windowWidth: card.offsetWidth,
      });

      // Try Web Share API first (mobile native share sheet — best UX)
      canvas.toBlob(async (blob) => {
        const filename = `しゅんの宣告_${today}.png`;

        if (navigator.share && navigator.canShare && navigator.canShare({ files: [new File([blob], filename, { type: 'image/png' })] })) {
          const file = new File([blob], filename, { type: 'image/png' });
          await navigator.share({
            files: [file],
            title: 'しゅんの宣告',
            text: `${today}\n\n#しゅんの宣告\nhttps://sn01dose.github.io/shun-no-senkoku/`
          });
          btn.textContent = '画像を保存してシェア';
          btn.style.pointerEvents = '';
          return;
        }

        // Fallback: direct download
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);

        // Show the "saved" overlay briefly
        overlay.classList.add('show');
        setTimeout(() => overlay.classList.remove('show'), 2400);

        btn.textContent = '画像を保存してシェア';
        btn.style.pointerEvents = '';
      }, 'image/png');

    } catch(err) {
      console.error(err);
      btn.textContent = '画像を保存してシェア';
      btn.style.pointerEvents = '';
    }
  });

  // Tap overlay to dismiss
  document.getElementById('dl-overlay').addEventListener('click', function(){
    this.classList.remove('show');
  });
})();
</script>
